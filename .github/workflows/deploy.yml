# Generates index.json from the entries and deploys it to GitHub Pages.
name: Deploy

on:
  push:
    branches: [master]
  # Each version's download count changes without a push.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      drhl_version:
        description: DRH Launcher release to run instead of DRHL_VERSION, a pre-release to test one
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download DRH Launcher
        env:
          GH_TOKEN: ${{ github.token }}
          DRHL_VERSION: ${{ inputs.drhl_version || vars.DRHL_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download $DRHL_VERSION --repo Tutez64/DRH-Launcher --pattern '*.AppImage' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          mv ./*.AppImage drhl.AppImage
          chmod +x drhl.AppImage
          # The launcher links fontconfig even without its window.
          ldconfig -p | grep -q libfontconfig.so.1 || { sudo apt-get update && sudo apt-get install -y libfontconfig1; }

      # The token is for GitHub's rate limit: the launcher reads each mod's
      # releases, for when a version was published and its downloads. What
      # GitHub did not answer is a note, shown as a warning; the index is
      # deployed without it.
      - name: Generate index.json
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/drhl.AppImage" --build-index . _site/index.json | tee "$RUNNER_TEMP/build-index.txt"
          sed -n 's/^note: /::warning::/p' "$RUNNER_TEMP/build-index.txt"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # From master only: run by hand on another branch, the workflow stops at
  # the artifact, which is how a change to it is tried.
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
