# Checks a pull request's entries with the latest DRH Launcher. Runs on
# `pull_request`: a read-only token and no secret, whoever opened it.
name: Check

on:
  pull_request:
    # To master only: the index. A pull request to another branch would be
    # checked by that branch's workflow and scripts, against its entries,
    # and its run would still be a check named `check` on the same commit.
    # A branch kept from before this line is not covered by it: delete a
    # branch once it is merged.
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      # The repository variable DRHL_VERSION picks a launcher release (a
      # pre-release to test one); empty, the latest.
      - name: Download DRH Launcher
        env:
          GH_TOKEN: ${{ github.token }}
          DRHL_VERSION: ${{ vars.DRHL_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download $DRHL_VERSION --repo Tutez64/DRH-Launcher --pattern '*.AppImage' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          mv ./*.AppImage drhl.AppImage
          chmod +x drhl.AppImage
          # The launcher links fontconfig even without its window.
          ldconfig -p | grep -q libfontconfig.so.1 || { sudo apt-get update && sudo apt-get install -y libfontconfig1; }

      # The checkout is the pull request merged into master as it is now: its
      # first parent is that master, where the event's base.sha is the master
      # the pull request was opened on, and everything merged since would
      # count as the pull request's.
      - name: Check the entries
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The branch's head before a push, empty on any other event.
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          REPORT: ${{ runner.temp }}/report/report.md
          PUSH_REPORT: ${{ runner.temp }}/report/push.md
        run: python3 .github/scripts/check_pull_request.py "$RUNNER_TEMP/drhl.AppImage" "$(git rev-parse HEAD^1)" "$BEFORE_SHA"

      # For the Comment workflow, which posts them on the pull request: this run cannot.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore
          retention-days: 7
